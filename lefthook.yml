# Maintainer hooks for this repository. They cover the environment only, never your_mods/.
#
# There are no hooks today, and this file is kept as the place for them. The mod checks live in
# .pi/extensions/mod-lint.ts and the agent runs them through the validate_mod tool. A maintainer
# checks reference/example_mod/ the same way: open the repository in pi and call validate_mod.
# A future pre-commit hook must reuse that check, so the repository never holds two versions of it.
