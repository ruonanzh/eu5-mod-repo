l_english:
 globalization_age.1.title: "Age of Globalization"
 globalization_age.1.desc: "Foreign traders, settlers, and goods are now a permanent feature of our world. Our court debates how we should face this accelerating exchange: export our own political vision and take an active role in global affairs, or absorb useful foreign ideas while concentrating on the welfare of our own people."
 globalization_age.1.descB: "What began as tentative contact with [ShowContinentName('america')] has matured into a global web of crops, animals, commodities, and ideas. We may project our ideology outward and shape the politics of globalization — or look inward, learn selectively from the world, and put our people's prosperity first."
 globalization_age.1.historical_info: "By the eighteenth century, the Columbian Exchange had become a lasting feature of the world economy. Maize, potatoes, sugar, coffee, and livestock reshaped diets and plantations on every inhabited continent, while imperial trade networks bound distant markets together — a prelude to modern globalization."
 globalization_age.1.a: "Outward politics: export our ideology and lead in global affairs."
 globalization_age.1.b: "Inward politics: absorb the world's ideas, but put our people's welfare first."
