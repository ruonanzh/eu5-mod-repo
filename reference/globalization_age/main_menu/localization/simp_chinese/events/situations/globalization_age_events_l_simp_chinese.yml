l_simp_chinese:
 globalization_age.1.title: "全球化时代"
 globalization_age.1.desc: "外来商人、移民与商品已成为我们世界的常态。朝堂之上正争论如何应对这场加速的交流：是输出本国政治理念、积极参与全球事务，还是吸纳有益的外来思想、同时着力提升本国人民的福祉。"
 globalization_age.1.descB: "与[ShowContinentName('america')]最初的试探性接触，如今已演变成作物、牲畜、商品与思想的全球网络。我们可以向外投射意识形态、塑造全球化政治——也可以着眼内政，有选择地学习世界，并把人民的福祉放在首位。"
 globalization_age.1.historical_info: "到18世纪，哥伦布大交换已成为世界经济的持久特征。玉米、马铃薯、糖、咖啡与牲畜重塑了各大陆的饮食与种植园，而帝国贸易网络将遥远的市场连成一体——这正是现代全球化的前奏。"
 globalization_age.1.a: "外向政治：输出本国意识形态，积极参与全球化政治。"
 globalization_age.1.b: "内向政治：吸纳世界思想，但着重提升人民福祉。"
