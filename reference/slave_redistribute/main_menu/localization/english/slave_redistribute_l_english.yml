 srd_send_slaves_confirm_desc: "Move #Y [SCOPE.sLocation('srd_source').GetTotalPopTypeSize(GetPopTypeByName('slaves'))|0]#! [ShowPopTypeName('slaves')] from @location![SCOPE.sLocation('srd_source').GetName] to @location![SCOPE.sLocation('srd_dest').GetName] ([SCOPE.sLocation('srd_dest').GetTotalPopTypeSize(GetPopTypeByName('slaves'))|0]).\n\nThe destination marker will stay active."
 srd_send_slaves_confirm_desc_excess: "Move #Y [SCOPE.sLocation('srd_source').GetExpectedUnEmployed(GetPopTypeByName('slaves'))|0]#! excess [ShowPopTypeName('slaves')] from @location![SCOPE.sLocation('srd_source').GetName] to @location![SCOPE.sLocation('srd_dest').GetName] ([SCOPE.sLocation('srd_dest').GetTotalPopTypeSize(GetPopTypeByName('slaves'))|0]).\n\nThe destination marker will stay active."
