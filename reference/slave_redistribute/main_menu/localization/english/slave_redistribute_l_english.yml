 srd_import_slaves_confirm_desc_excess: "Move #Y [SCOPE.sLocation('srd_source').GetExpectedUnEmployed(GetPopTypeByName('slaves'))|0]#! excess [ShowPopTypeName('slaves')] from @location![SCOPE.sLocation('srd_source').GetName] to @location![SCOPE.sLocation('srd_dest').GetName].\n\nAfter you confirm, the export marker will be cleared."
